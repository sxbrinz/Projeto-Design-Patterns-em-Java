# Nome da aplicação no Spring Boot
spring.application.name=budget-ai-service

# Configurações do banco de dados em memória H2
spring.datasource.url=jdbc:h2:mem:budgetdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Cria e atualiza as tabelas no banco automaticamente
spring.jpa.hibernate.ddl-auto=update

# Chave de API da OpenAI (lida a partir da variável de ambiente OPENAI_API_KEY)
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Modelo da OpenAI utilizado para interpretar comandos e acionar ferramentas (Tool Calling)
spring.ai.openai.chat.options.model=gpt-4o-mini